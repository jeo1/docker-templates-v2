name: Docker-compose (MariaDB)

on:
  push:
    branches: [mariadb]
    paths-ignore:
      - README.md
      - .gitignore
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'What triggered this workflow'
        required: false
        default: 'manual'
      run_id:
        description: 'Main workflow run ID'
        required: false

env:
  # Used as the ansible settings file (JSON is valid YAML)
  MANIFEST: .github/manifest.json

jobs:
  docker-compose-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip3 install ansible-core
          ansible-galaxy collection install -r requirements.yml

      # Creates .env, starts the containers (waits for MariaDB to be healthy)
      # and creates vm_table
      - name: Run setup playbook
        run: |
          ansible-playbook ansible/setup.yml -e @$MANIFEST

      - name: Check MariaDB is healthy
        run: |
          STATUS=$(docker inspect --format '{{.State.Health.Status}}' $(docker compose ps -q mariadb))
          if [[ "$STATUS" == "healthy" ]]; then
            echo "✅ MariaDB is healthy"
          else
            echo "❌ MariaDB status: $STATUS"
            exit 1
          fi

      - name: Check vm_table was created
        run: |
          MARIADB_USER=$(jq -r '.MARIADB_USER' $MANIFEST)
          MARIADB_PASSWORD=$(jq -r '.MARIADB_PASSWORD' $MANIFEST)
          MARIADB_DATABASE=$(jq -r '.MARIADB_DATABASE' $MANIFEST)
          columns=$(docker compose exec -T -e MYSQL_PWD="$MARIADB_PASSWORD" mariadb \
            mariadb --user="$MARIADB_USER" "$MARIADB_DATABASE" --skip-column-names \
            --execute="SELECT GROUP_CONCAT(COLUMN_NAME ORDER BY ORDINAL_POSITION) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='vm_table';")
          if [[ "$columns" == "name,ip,port" ]]; then
            echo "✅ vm_table exists with columns: $columns"
          else
            echo "❌ Expected columns name,ip,port, Got: '$columns'"
            exit 1
          fi

      # Simulate another machine: curl runs in its own container (separate
      # network namespace) and reaches the gateway through the host's IP,
      # not localhost.
      - name: Set gateway URL
        run: |
          HOST_IP=$(hostname -I | awk '{print $1}')
          HTTP_PORT=$(jq -r '.HTTP_PORT' $MANIFEST)
          echo "URL=http://$HOST_IP:$HTTP_PORT/sql" >> $GITHUB_ENV
          echo "API_TOKEN=$(jq -r '.API_TOKEN' $MANIFEST)" >> $GITHUB_ENV

      - name: Wait for gateway
        run: |
          for i in {1..60}; do
            # Any HTTP response (even 401) means the gateway is listening
            if curl --silent --output /dev/null $URL; then
              echo "Gateway is up!"
              exit 0
            fi
            echo "Waiting for gateway... ($i)"
            sleep 2
          done
          echo "❌ Gateway never came up"
          exit 1

      - name: Test gateway rejects bad token
        run: |
          code=$(docker run --rm curlimages/curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST $URL \
            -H "Authorization: Bearer wrong_token" \
            -H "Content-Type: application/json" \
            -d '{"sql": "SELECT * FROM vm_table"}')
          if [[ "$code" == "401" ]]; then
            echo "✅ Unauthorized request rejected"
          else
            echo "❌ Expected 401, Got: $code"
            exit 1
          fi

      - name: Test write to vm_table from another machine
        run: |
          response=$(docker run --rm curlimages/curl --silent --show-error --fail -X POST $URL \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"sql": "INSERT INTO vm_table (name, ip, port) VALUES (?, ?, ?)", "params": ["test-vm", "192.168.1.50", 22]}')
          echo "$response"
          if [[ $(echo "$response" | jq '.result.affectedRows') == "1" ]]; then
            echo "✅ Row inserted"
          else
            echo "❌ Insert failed"
            exit 1
          fi

      - name: Test read from vm_table from another machine
        run: |
          response=$(docker run --rm curlimages/curl --silent --show-error --fail -X POST $URL \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"sql": "SELECT * FROM vm_table"}')
          expected='{"result":[{"name":"test-vm","ip":"192.168.1.50","port":22}]}'
          if [[ "$response" == "$expected" ]]; then
            echo "✅ Response matches"
          else
            echo "❌ Expected: $expected, Got: $response"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down --volumes
