---
# Prepares this repository for deployment on the local machine by rendering
#   env.j2         -> .env
#   env-private.j2 -> private/.env
#
# Usage (from the repo root):
#   ansible-playbook setup.yml
#   ansible-playbook setup.yml -e MARIADB_DATABASE=app -e HTTP_PORT=9090
#   ansible-playbook setup.yml -e @my-vars.json
#   ansible-playbook setup.yml -e force=true   # re-render private/.env
#
# Secrets (MARIADB_ROOT_PASSWORD, MARIADB_PASSWORD, API_TOKEN) that are not
# supplied are generated randomly. An existing private/.env is never
# overwritten unless force=true, so generated secrets stay stable across runs.

- name: Set up repository for deployment
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    repo_dir: "{{ playbook_dir }}"
    force: false
    secret_length: 32

  tasks:
    - name: Check for existing private/.env
      ansible.builtin.stat:
        path: "{{ repo_dir }}/private/.env"
      register: private_env

    - name: Generate secrets that were not supplied
      ansible.builtin.set_fact:
        "{{ item }}": "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=secret_length | int) }}"
      loop:
        - MARIADB_ROOT_PASSWORD
        - MARIADB_PASSWORD
        - API_TOKEN
      when: lookup('ansible.builtin.vars', item, default='') | string | length == 0
      no_log: true

    - name: Render .env
      ansible.builtin.template:
        src: "{{ repo_dir }}/env.j2"
        dest: "{{ repo_dir }}/.env"
        mode: "0644"

    - name: Create private directory
      ansible.builtin.file:
        path: "{{ repo_dir }}/private"
        state: directory
        mode: "0700"

    - name: Render private/.env
      ansible.builtin.template:
        src: "{{ repo_dir }}/env-private.j2"
        dest: "{{ repo_dir }}/private/.env"
        mode: "0600"
        force: "{{ force | bool }}"
      no_log: true

    - name: Note that private/.env was left unchanged
      ansible.builtin.debug:
        msg: "private/.env already exists and was left unchanged (pass -e force=true to re-render it)."
      when: private_env.stat.exists and not (force | bool)

    - name: Create data directory
      ansible.builtin.file:
        path: "{{ (DATA | default('./data')) if (DATA | default('./data')) is abs else repo_dir ~ '/' ~ (DATA | default('./data')) }}"
        state: directory
        mode: "0755"
