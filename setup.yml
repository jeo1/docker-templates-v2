---
# Prepare this repo for deployment by creating:
#   .env          (from env.j2)
#   private/.env  (from env-private.j2)
#
# Run from the repo root:
#   ansible-playbook setup.yml
#
# Override any value with -e, for example:
#   ansible-playbook setup.yml -e MARIADB_DATABASE=app -e HTTP_PORT=9090
#
# Passwords and the API token are generated randomly unless you pass them.
# An existing private/.env is never overwritten, so secrets stay the same.

- name: Set up repo for deployment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Generate secrets that were not given with -e
      ansible.builtin.set_fact:
        MARIADB_ROOT_PASSWORD: "{{ MARIADB_ROOT_PASSWORD | default(lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits')) }}"
        MARIADB_PASSWORD: "{{ MARIADB_PASSWORD | default(lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits')) }}"
        API_TOKEN: "{{ API_TOKEN | default(lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits')) }}"
      no_log: true

    - name: Create .env
      ansible.builtin.template:
        src: env.j2
        dest: "{{ playbook_dir }}/.env"
        mode: "0644"

    - name: Create private folder
      ansible.builtin.file:
        path: "{{ playbook_dir }}/private"
        state: directory
        mode: "0700"

    - name: Create private/.env (skipped if it already exists)
      ansible.builtin.template:
        src: env-private.j2
        dest: "{{ playbook_dir }}/private/.env"
        mode: "0600"
        force: false
      no_log: true
