---
services:
    chaptarr:
        image: chaptarr/chaptarr:latest
        pull_policy: always
        container_name: "${CHAPTARR_CONTAINER_NAME}"
        environment:
            - PUID=1000
            - PGID=1000
        restart: unless-stopped
        ports:
            - "${EXTERNAL_CHAPTARR_PORT}:8789"
        volumes:
            - "${CHAPTARR_CONFIG}:/config"
            - "${CHAPTARR_AUDIOBOOKS}:/audiobooks"
            - "${CHAPTARR_EBOOKS}:/ebooks"
            - "${CHAPTARR_DOWNLOADS}:/downloads"