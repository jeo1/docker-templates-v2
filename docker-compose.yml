services:
  file-server:
    image: nginx:alpine
    pull_policy: always
    container_name: "${FILE_SERVER_CONTAINER_NAME}"
    restart: always
    volumes:
      - "${SHARE_DIR}:/usr/share/nginx/html:ro"
      - "$./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    ports:
      - "${FILE_SERVER_PORT}:80"
